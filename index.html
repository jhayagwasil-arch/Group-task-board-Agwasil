<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Task Board</title>
  <!-- Added Google Fonts for a premium look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="logo-area">
      <h1>TaskFlow</h1>
      <span class="badge">Group 4</span>
    </div>
    <p>Manage your team's web development sprint.</p>
  </header>

  <form class="toolbar" id="taskForm">
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="60" required>
    </div>
    
    <div class="input-group">
      <input type="text" list="memberList" id="ownerInput" placeholder="Assignee" maxlength="20">
      <datalist id="memberList"></datalist>
    </div>

    <div class="input-group">
      <select id="priorityInput">
        <option value="low">Low Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="high">High Priority</option>
      </select>
    </div>

    <div class="input-group">
      <select id="statusInput">
        <option value="todo" selected>To Do</option>
        <option value="progress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </div>

    <button type="submit" id="addBtn" class="btn-primary">+ Add Task</button>
    <button type="button" id="clearBtn" class="btn-danger">Clear Board</button>
  </form>

  <main class="board">
    <section class="column" data-status="todo">
      <div class="column-head">
        <h2>To Do</h2>
        <span class="count" id="count-todo">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
    </section>

    <section class="column" data-status="progress">
      <div class="column-head">
        <h2>In Progress</h2>
        <span class="count" id="count-progress">0</span>
      </div>
      <div class="task-list" id="list-progress"></div>
    </section>

    <section class="column" data-status="done">
      <div class="column-head">
        <h2>Done</h2>
        <span class="count" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
